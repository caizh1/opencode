<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">ChipMate VSCode 插件技术实现架构</title>
  <desc id="desc">整仓代码理解实现链路，展示 CodeGraph、RAG、Context Packer、内网 Qwen 模型、安全审批和 ToolRuntime 的正确数据流关系。</desc>
